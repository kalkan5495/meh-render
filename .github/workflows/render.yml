name: render
on:
  push:
    paths: ['jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-${{ github.sha }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Kurulum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow
          mkdir -p fonts
          for w in Black ExtraBold Bold; do
            curl -sSfL -o fonts/Montserrat-$w.ttf https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-$w.ttf || true
          done
          ls -la fonts
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: python run_job.py
